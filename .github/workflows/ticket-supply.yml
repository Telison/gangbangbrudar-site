name: Ticket supply

# Publishes the ticket numbers that biljetter/index.html renders.
#
# The snapshot lives on the orphan branch "ticket-data" rather than on main, for two reasons:
# it keeps the site history free of a commit every quarter hour, and a push made with
# GITHUB_TOKEN does not retrigger pages-build-deployment, so data committed to main would
# never actually reach the deployed site. The page reads the branch over
# raw.githubusercontent.com, which unlike Nortic sends Access-Control-Allow-Origin.

on:
  # The schedule is commented out between runs rather than deleted, so restarting the polling is
  # uncommenting three lines. Leave it off while no show is on sale: there is nothing to poll, and
  # GitHub disables schedules in dormant repositories anyway.
  #
  # On how often: GitHub honours cron on a best-effort basis and throttles hard. A */5 produced
  # nothing at all for the first hour and a half, and the */15 below actually ran about every two
  # to five hours. Treat whatever you set as an upper bound on frequency, not a promise.
  #
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-supply
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fetch script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Check out the data branch
        uses: actions/checkout@v5
        with:
          ref: ticket-data
          path: ticket-data

      - name: Fetch the current supply from Nortic
        # Nortic being briefly unreachable is not worth a failure mail every quarter hour.
        # A skipped run leaves the snapshot untouched, and the page surfaces that as staleness.
        continue-on-error: true
        run: node scripts/fetch-ticket-supply.mjs ticket-data

      - name: Publish the snapshot
        working-directory: ticket-data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ticket supply $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
